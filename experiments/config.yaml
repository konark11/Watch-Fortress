findings_path: experiments/data/real_findings.csv
pairs_path: experiments/data/real_labeled_pairs.csv
random_seed: 20261023
bootstrap_resamples: 1000
cost_per_token: null
llm:
  endpoint: ""
  model: "openai/gpt-oss-120b"
  api_key_env: OPENAI_API_KEY
jev:
  endpoint: ""
  model: "jev-latest"
  api_key_env: JEV_API_KEY
rag:
  embedding_model: BAAI/bge-base-en-v1.5
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_fallback: BAAI/bge-reranker-base
  chunk_size: 450
  chunk_overlap: 50
  dense_top_k: 50
  sparse_top_k: 50
  rrf_k: 60
  final_evidence_k: 5
  experiment_arms:
    - LLM-only
    - Vector RAG
    - Hybrid RAG
    - Hybrid + JEV verification
    - direct JEV retrieval
